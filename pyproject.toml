[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dna-semantic-compression"
version = "1.0.0-alpha"
description = "Genomic Semantic Compression Protocol (GAJE) for high-density vector storage."
authors = [{name = "Erick Aguilar"}]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "tokenizers>=0.13.0",
    "transformers>=4.25.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "bumpversion",
    "gradio",
    "maturin",
    "gguf",
    "scikit-learn"
]

[project.scripts]
gaje = "gaje.utils.cli:main"

[tool.maturin]
module-name = "gaje.core._impl"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.9.5-alpha"
commit = true
commit_args = ""
tag = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
