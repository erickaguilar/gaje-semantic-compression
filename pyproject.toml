[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dna-semantic-compression"
version = "1.7.0-alpha"
description = "Genomic Semantic Compression Protocol (GAJE) for high-density vector storage."
authors = [{name = "Erick Aguilar"}]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "tokenizers>=0.13.0",
    "transformers>=4.25.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "bumpversion",
    "gradio",
    "maturin",
    "gguf",
    "scikit-learn"
]

[project.scripts]
gaje = "gaje.utils.cli:main"

[tool.maturin]
module-name = "gaje.core._impl"
python-source = "python"
features = ["python"]

# Ruff linting (el hook pre-commit usa ruff v0.1.x; sintaxis [tool.ruff]).
[tool.ruff]
line-length = 88

# Los scripts, tooling, demos y tests son programas standalone que manipulan
# sys.path antes de importar modulos locales, por lo que E402 ("import fuera de
# top-level") es intencional ahi. El paquete real (python/gaje) se mantiene
# estricto con la regla.
[tool.ruff.per-file-ignores]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
"examples/**" = ["E402"]
"benchmarks/**" = ["E402"]
"legacy/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".*", "build", "dist", "*.egg", "tests/archive", "legacy"]

[tool.bumpversion]
current_version = "1.7.0-alpha"
commit = true
commit_args = ""
tag = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "python/gaje/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "python/gaje/utils/version.py"
search = 'return "{current_version}"'
replace = 'return "{new_version}"'

[[tool.bumpversion.files]]
filename = "python/gaje/nn/constants.py"
search = 'DEFAULT_VERSION = "{current_version}"'
replace = 'DEFAULT_VERSION = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/INDEX.md"
search = '(v{current_version})'
replace = '(v{new_version})'

[[tool.bumpversion.files]]
filename = "README.md"
search = '(v{current_version})'
replace = '(v{new_version})'

[[tool.bumpversion.files]]
filename = "docs/meta/EMPIRICAL_TRUTH_STATE.md"
search = '(v{current_version}: Helix Ecosystem)'
replace = '(v{new_version}: Helix Ecosystem)'

