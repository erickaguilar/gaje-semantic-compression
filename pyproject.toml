[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dna-semantic-compression"
version = "0.6.2"
description = "Genomic Semantic Compression Protocol (GAJE) for high-density vector storage."
authors = [{name = "Erick Aguilar"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "bumpversion",
    "gradio",
    "maturin",
    "sentence-transformers",
    "gguf",
    "tokenizers",
    "transformers",
    "scikit-learn",
    "scipy",
    "tqdm",
    "pyyaml",
    "requests"
]

[project.scripts]
gaje = "gaje.utils.cli:main"

[tool.maturin]
module-name = "gaje.core._impl"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.6.2"
commit = true
commit_args = ""
tag = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
