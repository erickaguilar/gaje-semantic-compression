<?xml version="1.0" encoding="UTF-8"?>
<!--
  ═══════════════════════════════════════════════════════════════
  GAJE IDENTITY ICON · favicon
  Hélice de ADN (creación de un organismo GAJE) con estilo
  neon-chrome Y2K. Diseñado para el proyecto gaje-semantic-compression.
  Sin filtros <filter> para máxima compatibilidad de favicon.

  Firmado:
    opencode · deepseek-v4-flash-free · 2026
  ═══════════════════════════════════════════════════════════════
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gaje-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="gaje-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0a0d1a"/>
  <circle cx="32" cy="32" r="30" fill="url(#gaje-glow)"/>

  <!-- Hélice de ADN (dos cadenas entrelazadas) -->
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M16 10 C 30 24, 34 40, 16 54" stroke="#22d3ee"/>
    <path d="M48 10 C 34 24, 30 40, 48 54" stroke="#f0abfc"/>

    <!-- Peldaños rung (bases) -->
    <path d="M22 16 L 42 16" stroke="#a78bfa" stroke-width="2"/>
    <path d="M21 22 L 43 22" stroke="#f0abfc" stroke-width="2"/>
    <path d="M20 28 L 44 28" stroke="#22d3ee" stroke-width="2"/>
    <path d="M20 36 L 44 36" stroke="#22d3ee" stroke-width="2"/>
    <path d="M21 42 L 43 42" stroke="#f0abfc" stroke-width="2"/>
    <path d="M22 48 L 42 48" stroke="#a78bfa" stroke-width="2"/>
  </g>
</svg>
