[package]
name = "dna-semantic-compression"
version = "0.6.1"
edition = "2021"
authors = ["Erick Aguilar"]
description = "Motor de compresión semántica genómica de alto rendimiento para LLMs en dispositivos móviles."

[lib]
name = "_impl"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gaje-cli"
path = "src/bin/gaje-cli.rs"

[dependencies]
# PyO3 para la interfaz con Python
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py310"] }

# Soporte para tensores de NumPy
numpy = "0.23.0"

# Paralelismo masivo (utilizado en genomización y búsqueda)
rayon = "1.10.0"

# Generación de números aleatorios para muestreo Top-P
rand = "0.8.5"

# Manejo de precisión f16 (Half) para compatibilidad con pesos GGUF
half = { version = "2.4.1", features = ["num-traits", "zerocopy"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.21.0"
redb = "2.1.1"
bincode = "1.3.3"

[profile.release]
# Optimizaciones balanceadas para Termux (evita OOM en el linker)
lto = "thin"
codegen-units = 16
opt-level = 3
panic = "abort"
strip = true
debug = false
