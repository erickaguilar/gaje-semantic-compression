[package]
name = "dna-semantic-compression"
version = "1.6.0-alpha"
edition = "2021"
authors = ["Erick Aguilar"]
description = "Motor de compresión semántica genómica de alto rendimiento para LLMs en dispositivos móviles."
license = "AGPL-3.0-only"
repository = "https://github.com/erickaguilar/gaje-semantic-compression"
homepage = "https://github.com/erickaguilar/gaje-semantic-compression"

[lib]
name = "_impl"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gaje-cli"
path = "src/bin/gaje-cli.rs"

[dependencies]
# PyO3 para la interfaz con Python (Opcional)
pyo3 = { version = "0.23.3", features = ["abi3-py310"], optional = true }
# Soporte para tensores de NumPy (Opcional)
numpy = { version = "0.23.0", optional = true }
# Paralelismo masivo
rayon = "1.10.0"
# Generación de números aleatorios
rand = "0.8.5"
lazy_static = "1.4.0"
ctrlc = "3.4"
libc = "0.2"
half = { version = "2.4.1", features = ["num-traits", "zerocopy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.21.0"
memmap2 = "0.9.4"
redb = "2.1.1"
bincode = "1.3.3"
lz4_flex = "0.11.3"
chrono = "0.4"
indicatif = "0.18.4"

[features]
default = []
python = ["pyo3", "numpy", "pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
panic = "unwind"
strip = true
debug = false

[profile.bench]
panic = "unwind"

[profile.dev-opt]
inherits = "dev"
opt-level = 3
debug = true
