[package]
name = "dna-semantic-compression"
version = "1.7.4"
edition = "2021"
authors = ["Erick Aguilar"]
description = "Motor de compresión semántica genómica de alto rendimiento para LLMs en dispositivos móviles."
license = "AGPL-3.0-only"
repository = "https://github.com/erickaguilar/gaje-semantic-compression"
homepage = "https://github.com/erickaguilar/gaje-semantic-compression"

[lib]
name = "_impl"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gaje-cli"
path = "src/bin/gaje-cli.rs"
required-features = ["native"]

[dependencies]
# PyO3 para la interfaz con Python (Opcional)
pyo3 = { version = "0.23.3", features = ["abi3-py310"], optional = true }
# Soporte para tensores de NumPy (Opcional)
numpy = { version = "0.23.0", optional = true }
# Paralelismo masivo
rayon = "1.10.0"
# Generación de números aleatorios
rand = "0.8.5"
lazy_static = "1.4.0"
half = { version = "2.4.1", features = ["num-traits", "zerocopy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
chrono = "0.4"
# Dependencias nativas opcionales (excluidas en compilación pura WASM)
tokenizers = { version = "0.21.0", optional = true }
memmap2 = { version = "0.9.4", optional = true }
ctrlc = { version = "3.4", optional = true }
libc = { version = "0.2", optional = true }
indicatif = { version = "0.18.4", optional = true }
ureq = { version = "2.10", features = ["tls"], optional = true }
clap = { version = "4.5", features = ["derive", "cargo"], optional = true }
tiny_http = { version = "0.12", optional = true }
rust-embed = { version = "8.5", optional = true }
# Aceleración por GPU (Vulkan / WGPU)
wgpu = { version = "24.0.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.20", features = ["derive"], optional = true }
# WebAssembly Runtime
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[features]
default = ["native", "gpu"]
native = ["dep:tokenizers", "dep:memmap2", "dep:ctrlc", "dep:libc", "dep:indicatif", "dep:ureq", "dep:clap", "dep:tiny_http", "dep:rust-embed"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
wasm = ["dep:wasm-bindgen"]
python = ["pyo3", "numpy", "pyo3/extension-module", "native", "gpu"]

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
panic = "unwind"
strip = true
debug = false

[profile.dev-opt]
inherits = "dev"
opt-level = 3
debug = true
