name: GAJE Helix Web UI & Native Engine CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  rust-tests:
    name: Rust Native Core & Kernels Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Test Native
        run: cargo test --release --verbose

  playwright-e2e:
    name: Web UI E2E Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Web UI E2E Test Suite
        run: npx playwright test --config=tests/ui_e2e/playwright.config.js
